name: Release RC CI

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Specific commit SHA to build (optional)"
        required: false
        type: string
      target:
        description: "Release-candidate platform to build"
        required: true
        default: "macos-intel"
        type: choice
        options:
          - macos-intel
          - linux-amd64
          - linux-arm64
          - all
      unsigned_macos:
        description: "Use an ad hoc signature for an internal macOS RC"
        required: true
        default: true
        type: boolean
      draft_tag:
        description: "Existing draft release tag to receive the Intel DMG (optional)"
        required: false
        type: string

env:
  NODE_VERSION: "22.14"
  RUST_VERSION: "1.93"

jobs:
  release-preflight:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout openrice source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout specific commit if provided
        if: github.event.inputs.commit_sha != ''
        run: git checkout ${{ github.event.inputs.commit_sha }}

      - name: Verify release version sources
        run: node scripts/verify-release-version.mjs

      - name: Verify optional draft release target
        if: inputs.draft_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$DRAFT_TAG" = "v$VERSION"
          test "$(gh release view "$DRAFT_TAG" --json isDraft --jq .isDraft)" = "true"

      - name: Require Apple credentials for signed macOS builds
        if: ${{ !inputs.unsigned_macos && (inputs.target == 'all' || inputs.target == 'macos-intel') }}
        env:
          APPLE_CERTIFICATE: "${{ secrets.ED_APPLE_CERTIFICATE }}"
          APPLE_CERTIFICATE_PASSWORD: "${{ secrets.ED_APPLE_CERTIFICATE_PASSWORD }}"
          APPLE_SIGNING_IDENTITY: "${{ secrets.ED_APPLE_SIGNING_IDENTITY }}"
          APPLE_ID: "${{ secrets.ED_APPLE_ID }}"
          APPLE_PASSWORD: "${{ secrets.ED_APPLE_PASSWORD }}"
          APPLE_TEAM_ID: "${{ secrets.ED_APPLE_TEAM_ID }}"
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

  # ─── macOS Intel CI ─────────────────────────────────────────────────────────
  release-macos-intel:
    needs: release-preflight
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos-intel'
    runs-on: macos-15-intel
    permissions:
      contents: write
    env:
      SKIP_SIGNING: ${{ github.event_name == 'workflow_dispatch' && inputs.unsigned_macos && 'true' || 'false' }}
    steps:
      - name: Checkout openrice source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout specific commit if provided
        if: github.event.inputs.commit_sha != ''
        run: git checkout ${{ github.event.inputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Add pnpm to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "PNPM_HOME=$HOME/.local" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Rust targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Get pnpm store directory
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules for Tauri (x86_64)
        env:
          npm_config_arch: x64
        run: |
          pnpm rebuild better-sqlite3
          mkdir -p node_modules/@photon-ai/imessage-kit/node_modules/better-sqlite3/build
          cp node_modules/better-sqlite3/build/Release/better_sqlite3.node \
             node_modules/@photon-ai/imessage-kit/node_modules/better-sqlite3/build/better_sqlite3.node

      - name: Verify native modules are built
        run: |
          echo "=== Checking top-level better-sqlite3 ==="
          ls -la node_modules/better-sqlite3/build/Release/better_sqlite3.node || exit 1
          echo "=== Checking nested better-sqlite3 in imessage-kit ==="
          ls -la node_modules/@photon-ai/imessage-kit/node_modules/better-sqlite3/build/better_sqlite3.node || exit 1
          echo "✅ All native modules built successfully"

      - name: Create .env file
        working-directory: ./apps/web
        run: |
          cat > .env << 'EOF'

          API_TIMEOUT_MS=3000000
          IS_TAURI=true

          EOF

      - name: Import Apple Certificate and Intermediate Certificates
        if: env.SKIP_SIGNING != 'true'
        env:
          APPLE_CERTIFICATE: "${{ secrets.ED_APPLE_CERTIFICATE }}"
          APPLE_CERTIFICATE_PASSWORD: "${{ secrets.ED_APPLE_CERTIFICATE_PASSWORD }}"
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH

          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -k $KEYCHAIN_PATH
          rm cert.p12

          curl -s -o /tmp/AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          curl -s -o /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import /tmp/AppleWWDRCAG3.cer -A -k $KEYCHAIN_PATH
          security import /tmp/DeveloperIDG2CA.cer -A -k $KEYCHAIN_PATH

          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Patch tauri.conf.json to skip bundler on macOS (Intel)
        working-directory: ./apps/web
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            c.bundle.targets = ['app'];
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(c, null, 2));
            console.log('Patched targets to app');
          "

      - name: Build unsigned Tauri app (Intel RC)
        if: env.SKIP_SIGNING == 'true'
        working-directory: ./apps/web
        run: pnpm tauri:build
        env:
          # macos-15-intel runner hits the 10s preflight timeout on the
          # Mine77 release URL. Skip in CI; real download happens elsewhere.
          SKIP_RENDER_ENGINE_PREFLIGHT: "true"

      - name: Build signed Tauri app (Intel)
        if: env.SKIP_SIGNING != 'true'
        working-directory: ./apps/web
        run: pnpm tauri:build
        env:
          APPLE_CERTIFICATE: "${{ secrets.ED_APPLE_CERTIFICATE }}"
          APPLE_CERTIFICATE_PASSWORD: "${{ secrets.ED_APPLE_CERTIFICATE_PASSWORD }}"
          APPLE_SIGNING_IDENTITY: "${{ secrets.ED_APPLE_SIGNING_IDENTITY }}"
          SIGNING_IDENTITY: "${{ secrets.ED_APPLE_SIGNING_IDENTITY }}"
          # macos-15-intel runner hits the 10s preflight timeout on the
          # Mine77 release URL. Skip in CI; real download happens elsewhere.
          SKIP_RENDER_ENGINE_PREFLIGHT: "true"

      - name: Verify bundled CLI (macOS x64)
        working-directory: ./apps/web
        run: node scripts/check-cli-bundled.js src-tauri/target/release/bundle/macos/openrice.app --platform macos

      - name: Apply ad hoc signature for unsigned RC
        if: env.SKIP_SIGNING == 'true'
        run: |
          set -e
          APP_BUNDLE="./apps/web/src-tauri/target/release/bundle/macos/openrice.app"
          codesign --force --deep --sign - --identifier "ai.traditionow.openrice" "$APP_BUNDLE"

      - name: Verify app signature
        run: |
          APP_BUNDLE="./apps/web/src-tauri/target/release/bundle/macos/openrice.app"
          test -x "$APP_BUNDLE/Contents/MacOS/openrice"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          codesign -dv --verbose=4 "$APP_BUNDLE" 2>&1 | head -20

      - name: Create DMG
        run: |
          mkdir -p ./apps/web/src-tauri/target/release/bundle/dmg
          rm -f ./apps/web/src-tauri/target/release/bundle/dmg/openrice*.dmg

          APP_BUNDLE="./apps/web/src-tauri/target/release/bundle/macos/openrice.app"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          DMG_PATH="./apps/web/src-tauri/target/release/bundle/dmg/openrice_${COMMIT_SHA}_x64.dmg"

          node apps/web/src-tauri/scripts/beautify-dmg.js \
            "$APP_BUNDLE" \
            "$DMG_PATH" \
            --app-name openrice \
            --bg ./apps/web/src-tauri/icons/dmg-background@2x.png

          echo "✅ Styled DMG created from signed app bundle"

      - name: Notarize DMG
        if: env.SKIP_SIGNING != 'true'
        timeout-minutes: 60
        run: |
          DMG_PATH=$(ls ./apps/web/src-tauri/target/release/bundle/dmg/openrice*.dmg)
          echo "Notarizing: $DMG_PATH"

          codesign -dv "$DMG_PATH" 2>&1 | head -5

          OUTPUT=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "${{ secrets.ED_APPLE_ID }}" \
            --password "${{ secrets.ED_APPLE_PASSWORD }}" \
            --team-id "${{ secrets.ED_APPLE_TEAM_ID }}" 2>&1)

          echo "$OUTPUT"

          SUBMISSION_ID=$(echo "$OUTPUT" | grep "id:" | head -1 | awk '{print $2}')
          if [ -z "$SUBMISSION_ID" ]; then
            echo "❌ Failed to get submission ID"
            exit 1
          fi

          echo "Submission ID: $SUBMISSION_ID"

          echo "Waiting for notarization to complete..."
          if xcrun notarytool wait "$SUBMISSION_ID" \
            --apple-id "${{ secrets.ED_APPLE_ID }}" \
            --password "${{ secrets.ED_APPLE_PASSWORD }}" \
            --team-id "${{ secrets.ED_APPLE_TEAM_ID }}" 2>&1; then
            echo "✅ Notarization accepted!"
          else
            echo "❌ Notarization failed"
            exit 1
          fi

          echo "Waiting for ticket propagation..."
          sleep 300

      - name: Staple DMG
        if: env.SKIP_SIGNING != 'true'
        run: |
          DMG_PATH=$(ls ./apps/web/src-tauri/target/release/bundle/dmg/openrice*.dmg)
          echo "Stapling: $DMG_PATH"

          STAPLED=false
          for i in $(seq 1 20); do
            echo "Staple attempt $i..."
            if xcrun stapler staple "$DMG_PATH" 2>&1; then
              echo "✅ Staple succeeded on attempt $i"
              STAPLED=true
              break
            else
              echo "Staple failed, waiting 60 seconds before retry..."
              sleep 60
            fi
          done

          if [ "$STAPLED" = "true" ]; then
            if xcrun stapler validate "$DMG_PATH" 2>&1; then
              echo "✅ DMG stapled and validated successfully"
            else
              echo "❌ DMG stapled but validation failed"
              exit 1
            fi
          else
            echo "❌ Failed to staple DMG after 20 attempts"
            exit 1
          fi

      - name: Upload Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: openrice-dmg-x64
          path: ${{ github.workspace }}/apps/web/src-tauri/target/release/bundle/dmg/openrice*.dmg

      - name: Upload Intel DMG to existing draft release
        if: inputs.draft_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_TAG: ${{ inputs.draft_tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SOURCE_DMG=$(ls ./apps/web/src-tauri/target/release/bundle/dmg/openrice*.dmg | head -1)
          RELEASE_DMG="./apps/web/src-tauri/target/release/bundle/dmg/openrice_${VERSION}_macOS_amd64.dmg"
          cp "$SOURCE_DMG" "$RELEASE_DMG"
          gh release upload "$DRAFT_TAG" "$RELEASE_DMG" --clobber

  # ─── Linux AMD64 CI ──────────────────────────────────────────────────────────
  release-linux-amd64:
    needs: release-preflight
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'linux-amd64'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout openrice source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout specific commit if provided
        if: github.event.inputs.commit_sha != ''
        run: git checkout ${{ github.event.inputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Add pnpm to PATH
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "PNPM_HOME=$HOME/.local" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Rust targets
        run: |
          rustup target add aarch64-unknown-linux-gnu
          rustup target add x86_64-unknown-linux-gnu

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libxkbcommon-dev \
            libssl-dev \
            build-essential \
            libasound2-dev \
            dpkg-dev

      - name: Get pnpm store directory
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules for Tauri
        run: |
          pnpm rebuild better-sqlite3
          mkdir -p node_modules/@photon-ai/imessage-kit/node_modules/better-sqlite3/build
          cp node_modules/better-sqlite3/build/Release/better_sqlite3.node \
             node_modules/@photon-ai/imessage-kit/node_modules/better-sqlite3/build/better_sqlite3.node

      - name: Verify native modules are built
        run: |
          echo "=== Checking top-level better-sqlite3 ==="
          ls -la node_modules/better-sqlite3/build/Release/better_sqlite3.node || exit 1
          echo "=== Checking nested better-sqlite3 in imessage-kit ==="
          ls -la node_modules/@photon-ai/imessage-kit/node_modules/better-sqlite3/build/better_sqlite3.node || exit 1
          echo "All native modules built successfully"

      - name: Create .env file
        working-directory: ./apps/web
        run: |
          cat > .env << 'EOF'

          API_TIMEOUT_MS=3000000
          IS_TAURI=true

          EOF

      - name: Patch tauri.conf.json to build Linux packages
        working-directory: ./apps/web
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            c.bundle.targets = ['deb', 'rpm'];
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(c, null, 2));
            console.log('Patched targets to deb and rpm');
          "

      - name: Build Tauri app (Linux)
        working-directory: ./apps/web
        run: pnpm tauri:build

      - name: Verify bundled CLI in Linux package
        working-directory: ./apps/web
        run: node scripts/check-cli-bundled.js "$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)" --platform linux

      - name: Upload Linux AMD64 packages
        uses: actions/upload-artifact@v4
        with:
          name: openrice-linux-amd64
          path: |
            ${{ github.workspace }}/apps/web/src-tauri/target/release/bundle/deb/*.deb
            ${{ github.workspace }}/apps/web/src-tauri/target/release/bundle/rpm/*.rpm

